<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eee9df">
  <title>Лучший покер. Онлайн.</title>
  <meta name="description" content="Премиальный онлайн-покер — где бы вы ни находились.">
  <style>
    :root {
      --paper: #eee9df;
      --paper-light: #f8f5ee;
      --ink: #172b35;
      --muted: #59676c;
      --line: rgba(23, 43, 53, .20);
      --accent: #7d3442;
      --accent-hover: #672936;
      --serif: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
      --sans: Inter, "Helvetica Neue", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--paper); }
    body {
      margin: 0;
      min-height: 100svh;
      padding: clamp(28px, 5vw, 64px) 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.62), transparent 54%),
        linear-gradient(145deg, var(--paper-light), var(--paper) 65%, #e4ddd1);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      width: min(100%, 1080px);
      margin: auto;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 clamp(18px, 2.4vw, 28px);
      color: var(--accent);
      font-size: 10px;
      line-height: 1.4;
      font-weight: 700;
      letter-spacing: .30em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 100%;
      margin: 0 auto;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(58px, 9.6vw, 132px);
      font-weight: 400;
      line-height: .98;
      letter-spacing: -.055em;
      text-align: center;
      text-wrap: balance;
    }

    h1 span { display: block; }

    .rule {
      height: 1px;
      width: 100%;
      margin: clamp(54px, 7vw, 88px) auto 0;
      background: var(--line);
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-bottom: 1px solid var(--line);
    }

    .feature {
      min-width: 0;
      min-height: 92px;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-size: clamp(14px, 1.65vw, 20px);
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -.02em;
      text-align: center;
      text-wrap: balance;
    }

    .feature:nth-child(odd) { border-right: 1px solid var(--line); }
    .feature:nth-child(-n+2) { border-bottom: 1px solid var(--line); }

    .cta-wrap { margin-top: clamp(48px, 6vw, 72px); }

    .cta {
      width: min(100%, 340px);
      min-height: 74px;
      padding: 20px 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fffaf2;
      text-decoration: none;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: .19em;
      text-align: center;
      box-shadow: 0 12px 28px rgba(82, 35, 46, .13);
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .cta:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(82, 35, 46, .18);
    }

    .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 5px; }

    .footnote {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.6;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      text-align: center;
    }

    @media (max-width: 640px) {
      body { padding: 36px 20px max(36px, env(safe-area-inset-bottom)); }
      .page { width: 100%; }
      .eyebrow { margin-bottom: 22px; font-size: 9px; letter-spacing: .23em; }
      h1 {
        max-width: 560px;
        font-size: clamp(52px, 12.2vw, 78px);
        line-height: .99;
        letter-spacing: -.06em;
      }
      .rule { margin-top: 54px; }
      .feature {
        min-height: 78px;
        padding: 16px 10px;
        font-size: clamp(13px, 3.5vw, 16px);
        line-height: 1.35;
      }
      .cta-wrap { margin-top: 48px; }
      .cta { min-height: 66px; width: min(100%, 340px); }
      .footnote { margin-top: 22px; font-size: 9px; letter-spacing: .11em; }
    }

    @media (max-width: 380px) {
      body { padding-left: 16px; padding-right: 16px; }
      h1 { font-size: clamp(46px, 12vw, 56px); }
      .feature { min-height: 74px; padding: 14px 7px; font-size: 12px; }
      .rule { margin-top: 44px; }
      .cta-wrap { margin-top: 40px; }
    }

    @media (max-height: 700px) and (min-width: 641px) {
      body { align-items: flex-start; }
      .page { margin: 20px auto; }
      .rule { margin-top: 48px; }
      .feature { min-height: 76px; }
      .cta-wrap { margin-top: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
